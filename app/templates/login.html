<!DOCTYPE html>
<html>
<head>
    <title>ROSLI's - Web UI & REST API Application - Login</title>
</head>

<body>

<h1>ROSLI Server (Web UI + API)</h1>

<h2>Login</h2>

<form method="POST">

    <div>
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
        >
    </div>

    <br>

    <div>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
        >
    </div>

    <br>

    <button type="submit" id="login-button">
        Login
    </button>

</form>

{% if error %}

<p id="login-error">
    {{ error }}
</p>

{% endif %}

</body>
</html>
